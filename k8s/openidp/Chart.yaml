apiVersion: v2
name: openidp
description: Infosys DevOps Platform - Complete CI/CD automation platform
type: application
version: 1.7.0
appVersion: "1.7.0"
keywords:
  - devops
  - cicd
  - jenkins
  - grafana
  - microservices
home: https://github.com/thegovind/openIDP
sources:
  - https://github.com/thegovind/openIDP
maintainers:
  - name: openIDP Team
    email: openidp@infosys.com
dependencies:
  - name: postgresql
    version: 12.1.9
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: zookeeper
    version: 11.1.6
    repository: https://charts.bitnami.com/bitnami
    condition: zookeeper.enabled
  - name: kafka
    version: 20.0.6
    repository: https://charts.bitnami.com/bitnami
    condition: kafka.enabled
