{{- if .Values.subscription.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: subscription
  labels:
    {{- include "openidp.labels" . | nindent 4 }}
    app.kubernetes.io/component: subscription
spec:
  type: ClusterIP
  ports:
    - port: 8085
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "openidp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: subscription
{{- end }}
