apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openidp.fullname" . }}-grafana-config
  labels:
    {{- include "openidp.labels" . | nindent 4 }}
data:
  grafana.ini: |
    [server]
    protocol = http
    http_port = 3000
    domain = {{ .Values.config.hostname }}
    root_url = {{ if .Values.ssl.enabled }}https{{ else }}http{{ end }}://{{ .Values.config.hostname }}{{ if ne .Values.config.customPort 80 }}{{ if ne .Values.config.customPort 443 }}:{{ .Values.config.customPort }}{{ end }}{{ end }}/grafana/
    serve_from_sub_path = true
    
    [database]
    type = postgres
    host = {{ include "openidp.fullname" . }}-postgresql:5432
    name = grafana
    user = {{ .Values.postgresql.auth.username }}
    password = {{ .Values.postgresql.auth.password }}
    
    [security]
    admin_user = admin
    admin_password = {{ .Values.grafana.adminPassword }}
    
    [auth]
    disable_login_form = false
    
    [users]
    allow_sign_up = false
    
    [log]
    mode = console
    level = info
