{{- if .Values.jenkins.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "openidp.fullname" . }}-jenkins
  labels:
    {{- include "openidp.labels" . | nindent 4 }}
    app.kubernetes.io/component: jenkins
spec:
  serviceName: jenkins
  replicas: 1
  selector:
    matchLabels:
      {{- include "openidp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: jenkins
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "openidp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: jenkins
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "openidp.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: jenkins
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}/idpjenkins:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: slave
              containerPort: 50000
              protocol: TCP
          env:
            {{- include "openidp.commonEnv" . | nindent 12 }}
            - name: JENKINS_HOME
              value: "/var/jenkins_home/"
            - name: JENKINS_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "openidp.fullname" . }}-config
                  key: JENKINS_USERNAME
            - name: JENKINS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openidp.fullname" . }}-secret
                  key: JENKINS_PASSWORD
          volumeMounts:
            - name: jenkins-data
              mountPath: /var/jenkins_home
            - name: dsl-data
              mountPath: /DSL
            - name: server-config
              mountPath: /usr/local/tomcat/conf/server.xml
              subPath: server.xml
          livenessProbe:
            httpGet:
              path: /jenkins
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /jenkins
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 2000m
              memory: 4Gi
            requests:
              cpu: 1000m
              memory: 2Gi
      volumes:
        - name: dsl-data
          persistentVolumeClaim:
            claimName: {{ include "openidp.fullname" . }}-dsl-pvc
        - name: server-config
          configMap:
            name: {{ include "openidp.fullname" . }}-jenkins-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: jenkins-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.jenkins.persistence.size }}
{{- end }}
