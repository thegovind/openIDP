{{- if .Values.eureka.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openidp.fullname" . }}-config
  labels:
    {{- include "openidp.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "openidp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: config
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "openidp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: config
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "openidp.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: config
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}/idpconfig:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
          env:
            {{- include "openidp.commonEnv" . | nindent 12 }}
            - name: CONFIG_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "openidp.fullname" . }}-config
                  key: CONFIG_USERNAME
            - name: CONFIG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openidp.fullname" . }}-secret
                  key: CONFIG_PASSWORD
            {{- if .Values.ssl.enabled }}
            - name: SSL_CA_LOC
              value: "/certs/cacerts"
            {{- end }}
          {{- if .Values.ssl.enabled }}
          volumeMounts:
            - name: certs
              mountPath: /certs
          {{- end }}
          livenessProbe:
            httpGet:
              path: /config/idpoauth/paas
              port: http
              httpHeaders:
                - name: Authorization
                  value: "Basic {{ printf "%s:%s" .Values.config.configUsername .Values.config.configPassword | b64enc }}"
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /config/idpoauth/paas
              port: http
              httpHeaders:
                - name: Authorization
                  value: "Basic {{ printf "%s:%s" .Values.config.configUsername .Values.config.configPassword | b64enc }}"
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.ssl.enabled }}
      volumes:
        - name: certs
          secret:
            secretName: {{ include "openidp.fullname" . }}-certs
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
