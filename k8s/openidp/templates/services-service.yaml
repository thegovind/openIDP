{{- if .Values.services.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: services
  labels:
    {{- include "openidp.labels" . | nindent 4 }}
    app.kubernetes.io/component: services
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "openidp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: services
{{- end }}
