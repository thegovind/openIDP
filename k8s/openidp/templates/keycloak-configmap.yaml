apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openidp.fullname" . }}-keycloak-theme
  labels:
    {{- include "openidp.labels" . | nindent 4 }}
data:
  theme.properties: |
    parent=keycloak
    import=common/keycloak
    
    styles=css/login.css css/styles.css
    
    locales=en,de,fr,es,it,pt-BR,ja,zh-CN,ru
