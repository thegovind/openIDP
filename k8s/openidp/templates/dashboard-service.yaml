{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  labels:
    {{- include "openidp.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  ports:
    - port: 8084
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "openidp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
{{- end }}
