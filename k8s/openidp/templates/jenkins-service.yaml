{{- if .Values.jenkins.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  labels:
    {{- include "openidp.labels" . | nindent 4 }}
    app.kubernetes.io/component: jenkins
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
    - port: 50000
      targetPort: slave
      protocol: TCP
      name: slave
  selector:
    {{- include "openidp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: jenkins
{{- end }}
