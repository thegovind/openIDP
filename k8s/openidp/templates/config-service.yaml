{{- if .Values.eureka.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: config
  labels:
    {{- include "openidp.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
spec:
  type: ClusterIP
  ports:
    - port: 8888
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "openidp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: config
{{- end }}
