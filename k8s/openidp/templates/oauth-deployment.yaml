{{- if .Values.oauth.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openidp.fullname" . }}-oauth
  labels:
    {{- include "openidp.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "openidp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: oauth
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "openidp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: oauth
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "openidp.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: oauth
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}/idpoauth:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9999
              protocol: TCP
          env:
            {{- include "openidp.commonEnv" . | nindent 12 }}
            {{- include "openidp.dbEnv" . | nindent 12 }}
            {{- include "openidp.kafkaEnv" . | nindent 12 }}
            {{- include "openidp.serviceEnv" . | nindent 12 }}
            - name: KEYCLOAK_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "openidp.fullname" . }}-config
                  key: KEYCLOAK_HOSTNAME
            - name: KEYCLOAK_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "openidp.fullname" . }}-config
                  key: KEYCLOAK_PORT
            - name: KEYCLOAK_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "openidp.fullname" . }}-config
                  key: KEYCLOAK_USER
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openidp.fullname" . }}-secret
                  key: KEYCLOAK_PASSWORD
            - name: AUTH_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "openidp.fullname" . }}-config
                  key: AUTH_PROVIDER
            - name: LDAP_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "openidp.fullname" . }}-config
                  key: LDAP_URL
            - name: SMTP_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: {{ include "openidp.fullname" . }}-config
                  key: SMTP_DOMAIN
            {{- if .Values.ssl.enabled }}
            - name: SSL_CA_LOC
              value: "/certs/cacerts"
            {{- end }}
          {{- if .Values.ssl.enabled }}
          volumeMounts:
            - name: certs
              mountPath: /certs
          {{- end }}
          livenessProbe:
            httpGet:
              path: /idp-oauth/login
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /idp-oauth/login
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.ssl.enabled }}
      volumes:
        - name: certs
          secret:
            secretName: {{ include "openidp.fullname" . }}-certs
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
