name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  java-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: "services", path: "service/Services", dockerfile: "service/Services/restapi/Dockerfile" }
          - { name: "oauth", path: "service/Services", dockerfile: "service/Services/authservice/Dockerfile" }
          - { name: "cloud-config", path: "service/Cloud-Config", dockerfile: "service/Cloud-Config/Dockerfile" }
          - { name: "eureka", path: "service/eureka-service", dockerfile: "service/eureka-service/Dockerfile" }
          - { name: "dashboard", path: "dashboard", dockerfile: "dashboard/Dockerfile" }
          - { name: "subscription", path: "subscription", dockerfile: "subscription/Dockerfile" }
          - { name: "scheduler", path: "scheduler/SchedulerService", dockerfile: "scheduler/SchedulerService/Dockerfile" }
          - { name: "jenkins-connector", path: "connectors/jenkins", dockerfile: "connectors/jenkins/Dockerfile" }
          - { name: "orchestrator", path: "orchestrator/orchestrator_java", dockerfile: "orchestrator/orchestrator_java/Dockerfile" }
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
    
    - name: Build root pom
      run: mvn clean install -Dmaven.test.skip=true
    
    - name: Build ${{ matrix.service.name }}
      run: |
        cd ${{ matrix.service.path }}
        mvn clean install -Dmaven.test.skip=true
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service.name }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ matrix.service.dockerfile }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  ui-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '14'
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json
    
    - name: Build UI
      run: |
        cd ui
        npm install
        npm run build
    
    - name: Set up JDK 8 for UI packaging
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
    
    - name: Package UI with Maven
      run: |
        cd ui
        mvn clean install -Dmaven.test.skip=true
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ui
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha
    
    - name: Build and push UI Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ui/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  jenkins-tools:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
    
    - name: Build Jenkins Custom Tools
      run: |
        cd jenkins/custom_tools/DevopsJsonConv
        mvn clean install -Dmaven.test.skip=true
        cd ../MetricsProcessor
        mvn clean install -Dmaven.test.skip=true
        cd ../ReportFetchUtil
        mvn clean install -Dmaven.test.skip=true
        cd ../SchedulerUtility
        mvn clean install -Dmaven.test.skip=true
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/jenkins
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha
    
    - name: Build and push Jenkins Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: jenkins/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
