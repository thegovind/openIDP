name: DSL Build

on:
  push:
    branches: [ master, main ]
    paths: [ 'dsl/**' ]
  pull_request:
    branches: [ master, main ]
    paths: [ 'dsl/**' ]

jobs:
  dsl-build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: wrapper
    
    - name: Build DSL
      run: |
        cd dsl
        gradle build
    
    - name: Upload DSL artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dsl-artifacts
        path: dsl/target/DSL.zip
        retention-days: 30
