name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      ssl_enabled:
        description: 'Enable SSL'
        required: true
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Deploy to ${{ github.event.inputs.environment }}
      run: |
        export SSL_ENABLED=${{ github.event.inputs.ssl_enabled }}
        export DOCKER_REPO=ghcr.io/${{ github.repository }}/
        export BUILD_NAME=${{ github.sha }}
        export HOSTNAME=${{ secrets.DEPLOYMENT_HOSTNAME }}
        export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
        export KEYCLOAK_PASSWORD=${{ secrets.KEYCLOAK_PASSWORD }}
        export JENKINS_USERNAME=${{ secrets.JENKINS_USERNAME }}
        export JENKINS_PASSWORD=${{ secrets.JENKINS_PASSWORD }}
        
        chmod +x build.sh
        ./build.sh
      env:
        AUTOMATED_DEPLOYMENT: true
        SKIP_BUILD: true
        SKIP_TESTS: true
